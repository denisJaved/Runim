[package]
name = "runim"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.34.1"}
log = "0.4.34"
env_logger = "0.11.11"
anyhow = "1.0.104"
parking_lot = "0.13.0"
thiserror = "2.0.21"

wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true}

[features]
default = ["debugging", "prefixed_prelude", "builtin_renderer"]
debugging = []
prefixed_prelude = []
builtin_renderer = ["wgpu", "winit", "bytemuck", "pollster", "image"]

# TODO: Use parking_lot only if corresponding feature is enabled
