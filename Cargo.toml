[package]
name = "runim"
version = "0.0.0-alpha1"
edition = "2024"
license = "MIT or Apache-2.0"
description = "Math animation rendering library"
repository = "https://github.com/denisJaved/Runim/"
keywords = ["graphics", "math", "video"]
categories = ["graphics", "rendering::engine", "visualization"]
documentation = "https://docs.rs/runim"
readme = false
exclude = [".idea", ".idea/**"]

[dependencies]
runim-derive = { path = "runim-derive", version = "0.0.0-alpha1" }

glam = { version = "0.34.1"}
log = "0.4.34"
anyhow = "1.0.104"
parking_lot = "0.13.0"
thiserror = "2.0.21"

wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true}

[features]
default = ["debugging", "prefixed_prelude", "builtin_renderer"]
debugging = []
prefixed_prelude = []
builtin_renderer = ["wgpu", "winit", "bytemuck", "pollster", "image"]

# TODO: Use parking_lot only if corresponding feature is enabled

[workspace]
members = ["runim-derive"]