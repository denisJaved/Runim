name: Deploy mdBook documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          cd docs
          mkdir bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz --directory=bin
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: |
          cd docs
          ./bin/mdbook build
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/home/runner/work/Runim/Runim/docs/book'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
